name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.0). Must match VERSION.'
        required: true
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Check the version
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) { $v = '${{ github.ref_name }}' -replace '^v', '' }
          $file = (Get-Content VERSION -Raw).Trim()
          if ($v -ne $file) {
            Write-Host "::error::Releasing $v, but the VERSION file says $file."
            exit 1
          }
          Write-Host "Releasing Purview Configuration Viewer $v"

      - name: Install ExchangeOnlineManagement
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module ExchangeOnlineManagement -Scope CurrentUser -Force -AllowClobber

      - name: Build, test and package
        shell: pwsh
        run: .\build.ps1 -Package

      - uses: actions/upload-artifact@v7
        with:
          name: pkg
          path: artifacts/PurviewViewer-*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pkg
          path: dist

      - name: Work out the version
        id: v
        run: |
          V='${{ github.event.inputs.version }}'
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum PurviewViewer-*.zip | tee SHA256SUMS.txt
          ls -la

      # The notes are this version's CHANGELOG section followed by a footer kept in docs/, with VERSION replaced.
      - name: Release notes
        run: |
          V='${{ steps.v.outputs.version }}'
          awk -v v="$V" '/^## \[/ { p = (index($0, "## [" v "]") == 1) } /^\[[0-9]/ { p = 0 } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Purview Configuration Viewer $V." > notes.md
          echo >> notes.md
          sed "s/VERSION/$V/g" docs/release-notes-footer.md >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Purview Configuration Viewer ${{ steps.v.outputs.version }}
          body_path: notes.md
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ startsWith(steps.v.outputs.version, '0.') }}
          fail_on_unmatched_files: true
          files: |
            dist/PurviewViewer-*.zip
            dist/SHA256SUMS.txt
