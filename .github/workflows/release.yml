name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.3.0). Must match VERSION.'
        required: true
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build, test and package
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Check the version
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) { $v = '${{ github.ref_name }}' -replace '^v', '' }
          $file = (Get-Content VERSION -Raw).Trim()
          if ($v -ne $file) {
            Write-Host "::error::Releasing $v, but the VERSION file says $file."
            exit 1
          }
          Write-Host "Releasing Purview Explorer $v"

      - name: Install ExchangeOnlineManagement
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module ExchangeOnlineManagement -Scope CurrentUser -Force -AllowClobber

      - name: Build, test, package and build the setups
        shell: pwsh
        run: .\build.ps1 -Package -Setup

      - name: Test the x64 setup (module already installed)
        shell: pwsh
        run: |
          .\installer\test-setup.ps1 -Setup (Get-ChildItem artifacts\PurviewExplorer-*-win-x64-setup.exe)[0].FullName
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7
        with:
          name: pkg
          path: |
            artifacts/PurviewExplorer-*.zip
            artifacts/PurviewExplorer-*-setup.exe
          if-no-files-found: error

  setup-clean-machine:
    name: Test the ${{ matrix.arch }} setup on a clean machine
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x64,   runner: windows-2022 }
          - { arch: arm64, runner: windows-11-arm }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pkg
          path: artifacts

      - name: Make the runner look like a fresh Windows
        shell: pwsh
        run: .\installer\make-runner-clean.ps1

      - name: Install, verify and uninstall
        shell: pwsh
        run: |
          .\installer\test-setup.ps1 -Setup (Get-ChildItem artifacts\PurviewExplorer-*-win-${{ matrix.arch }}-setup.exe)[0].FullName -ExpectModuleInstall
          exit $LASTEXITCODE

  release:
    name: Publish the release
    needs: [build, setup-clean-machine]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pkg
          path: dist

      - name: Work out the version
        id: v
        run: |
          V='${{ github.event.inputs.version }}'
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum PurviewExplorer-* | tee SHA256SUMS.txt
          ls -la

      # The notes are this version's CHANGELOG section followed by a footer kept in docs/, with VERSION replaced.
      - name: Release notes
        run: |
          V='${{ steps.v.outputs.version }}'
          awk -v v="$V" '/^## \[/ { p = (index($0, "## [" v "]") == 1) } /^\[[0-9]/ { p = 0 } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Purview Explorer $V." > notes.md
          echo >> notes.md
          sed "s/VERSION/$V/g" docs/release-notes-footer.md >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Purview Explorer ${{ steps.v.outputs.version }}
          body_path: notes.md
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ startsWith(steps.v.outputs.version, '0.') }}
          fail_on_unmatched_files: true
          files: |
            dist/PurviewExplorer-*-win-x64.zip
            dist/PurviewExplorer-*-win-arm64.zip
            dist/PurviewExplorer-*-win-x64-setup.exe
            dist/PurviewExplorer-*-win-arm64-setup.exe
            dist/SHA256SUMS.txt
